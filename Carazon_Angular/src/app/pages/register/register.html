<section 
  class="flex flex-col justify-center 
         bg-gray-50 dark:bg-gray-900 
         min-h-screen w-full">

  <div 
    class="grow flex items-center 
           justify-center px-6 py-8">

    <div 
      class="w-full max-w-md bg-white rounded-lg shadow 
             dark:border dark:bg-gray-800 dark:border-gray-700">

      <div 
        class="p-6 space-y-4 md:p-8">

        <h1 
          class="text-xl font-bold leading-tight tracking-tight 
                 text-gray-900 md:text-2xl dark:text-white text-center">
          Regisztrálj egy új fiókot.
        </h1>

        <form 
          #regForm="ngForm"
          class="space-y-4 md:space-y-6" 
          (ngSubmit)="onSubmit()">

          <div>
            <label 
              for="name" 
              class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
              Teljes név
            </label>
            <input 
              type="text" 
              name="name"
              maxlength="100"
              [(ngModel)]="regData.name"
              id="name" 
              autocomplete="name"
              class="bg-gray-50 border border-gray-300 
                     text-gray-900 rounded-lg 
                     focus:ring-primary-600 focus:border-primary-600 
                     block w-full p-2.5 
                     dark:bg-gray-700 dark:border-gray-600 
                     dark:text-white
                     placeholder-gray-500" 
              placeholder="Felhasználónév" 
              required>
          </div>

          <div>
            <label 
              for="email" 
              class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
              Email
            </label>
            <input 
              type="email"
              maxlength="150"
              name="email" 
              [(ngModel)]="regData.email"
              #emailInput="ngModel"
              id="email" 
              pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$"
              autocomplete="email"
              class="bg-gray-50 border border-gray-300 
                     text-gray-900 rounded-lg 
                     focus:ring-primary-600 focus:border-primary-600 
                     block w-full p-2.5 
                     dark:bg-gray-700 dark:border-gray-600 
                     dark:text-white
                     placeholder-gray-500" 
              placeholder="email@pelda.hu" 
              required
              email> <div 
              class="min-h-5 mt-1">
              <p 
                *ngIf="emailInput.invalid && emailInput.touched" 
                class="text-xs text-red-600 dark:text-red-400 font-medium">
                Kérjük, adj meg egy érvényes email címet (pl. @ jellel)!
              </p>
            </div>
          </div>

          <div>
            <label 
              for="phone" 
              class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
              Telefonszám
            </label>
            <input 
              type="tel" 
              name="phone"
              [(ngModel)]="regData.phone"
              #phoneInput="ngModel"
              id="phone" 
              autocomplete="tel"
              pattern="^(\+?[0-9\s\-]{7,15})$"
              class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg 
                       focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 
                       dark:bg-gray-700 dark:border-gray-600 dark:text-white placeholder-gray-500" 
              placeholder="+36 30 123 4567" 
              required>
          
            <div class="min-h-5 mt-1">
              <p 
                *ngIf="phoneInput.invalid && phoneInput.touched" 
                class="text-xs text-red-600 dark:text-red-400 font-medium">
                <span *ngIf="phoneInput.errors?.['required']">A telefonszám kötelező!</span>
                <span *ngIf="phoneInput.errors?.['pattern']">Érvénytelen formátum! Példa: +36 30 123 4567</span>
              </p>
            </div>
          </div>

          <div>
            <label 
              for="password" 
              class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
              Jelszó
            </label>
            <input 
              [type]="isPasswordVisible ? 'text' : 'password'" 
              name="password"
              maxlength="100"
              pattern="^(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{6,20}$"
              [(ngModel)]="regData.password"
              id="password" 
              class="bg-gray-50 border border-gray-300 
                     text-gray-900 rounded-lg 
                     focus:ring-primary-600 focus:border-primary-600 
                     block w-full p-2.5 
                     dark:bg-gray-700 dark:border-gray-600 
                     dark:text-white" 
              required>
          </div>

          <div>
            <label 
              for="confirmPassword" 
              class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
              Jelszó megerősítése
            </label>
            <input 
              [type]="isPasswordVisible ? 'text' : 'password'" 
              name="confirmPassword"
              maxlength="100"
              [(ngModel)]="regData.confirmPassword"
              id="confirmPassword" 
              class="bg-gray-50 border border-gray-300 
                     text-gray-900 rounded-lg 
                     focus:ring-primary-600 focus:border-primary-600 
                     block w-full p-2.5 
                     dark:bg-gray-700 dark:border-gray-600 
                     dark:text-white" 
              required>
            
            <div 
              class="min-h-5 mt-1">
              <p 
                *ngIf="regData.confirmPassword && regData.password !== regData.confirmPassword" 
                class="text-xs text-red-600 dark:text-red-400 font-medium">
                A két jelszó nem egyezik meg!
              </p>
            </div>
          </div>

          <div 
            class="flex items-center">
            <div 
              class="flex items-center h-5">
              <input 
                id="showpass" 
                (change)="togglePassword()" 
                type="checkbox" 
                class="w-4 h-4 border border-gray-300 
                       rounded bg-gray-50 
                       focus:ring-3 focus:ring-primary-300 
                       dark:bg-gray-700 dark:border-gray-600 
                       dark:focus:ring-primary-600">
            </div>
            <div 
              class="ml-3 text-sm">
              <label 
                for="showpass" 
                class="text-gray-500 dark:text-gray-300">
                Mutasd a jelszót!
              </label>
            </div>
          </div>

          <button 
            type="submit" 
            [disabled]="regForm.invalid || regData.password !== regData.confirmPassword"
            class="w-full text-white bg-amber-600 
                   hover:bg-amber-700 
                   disabled:opacity-50 disabled:cursor-not-allowed 
                   focus:ring-4 focus:outline-none 
                   focus:ring-amber-300 
                   font-medium rounded-lg text-sm 
                   px-5 py-2.5 text-center 
                   dark:bg-amber-600 dark:hover:bg-amber-700 
                   dark:focus:ring-amber-800">
            Regisztráció
          </button>

          <p 
            class="text-sm font-light text-center
                   text-gray-500 dark:text-gray-400">
            Van már fiókod? 
            <a 
              href="Login" 
              class="font-medium text-primary-600 
                     hover:underline dark:text-primary-500">
              Bejelentkezés
            </a>
          </p>

        </form>
      </div>
    </div>
  </div>
</section>
