<div class="home-container 
            min-h-screen 
            bg-white">
  <!-- Fenti hatter -->
  <section class="hero-section 
                  relative 
                  overflow-hidden 
                  min-h-screen 
                  flex 
                  items-center">
  
    <!-- Hatter video -->
    <div class="hero-parallax-container 
                absolute
                inset-0 
                w-full 
                h-full">
      <video autoplay 
             muted 
             loop 
             playsinline 
             class="hero-video 
               absolute 
               inset-0 
               w-full 
               h-full 
               object-cover" 
              src="https://www.pexels.com/download/video/8469665/">
      </video>
      <div class="hero-overlay 
                  absolute 
                  inset-0 
                  bg-black/60 
                  transition-opacity 
                  duration-300">
      </div>
    </div>
    <!-- Tartalom -->
    <div class="hero-content 
                w-full 
                px-4 
                md:px-6 
                relative 
                z-10
                lg:ml-32">
      <div class="grid 
                  lg:grid-cols-2 
                  gap-8 
                  lg:gap-12 
                  items-center">
        <!-- Bal oldali iras -->
        <div class="hero-left 
                    space-y-6 
                    animate-fade-up">
          <h1 class="text-4xl 
                     md:text-5xl 
                     lg:text-6xl 
                     xl:text-7xl 
                     font-bold 
                     text-white 
                     tracking-tight 
                     leading-tight">
            {{ heroTitle }}
          </h1>
          <p class="text-xl 
                    lg:text-2xl 
                    text-amber-100 
                    font-light">
            {{ heroSubtitle }}
          </p>
          <p class="text-lg 
                    text-gray-200 
                    max-w-2xl 
                    leading-relaxed">
            {{ heroDescription }}
          </p>
          <div class="hero-actions 
                      flex 
                      flex-wrap 
                      gap-4 
                      pt-4">
            <a href="/Projects">
              <button (click)="Munkaink()" 
                      class="px-6 md:px-8 py-3 md:py-4 
                       text-base md:text-lg 
                       font-medium rounded-lg 
                      bg-amber-600 hover:bg-amber-700 
                      text-white transition-all duration-300
                       transform hover:scale-105 
                       active:scale-95 shadow-lg hover:shadow-xl">
                Munkáink megtekintése
              </button>
            </a>
            <a href="/services">
              <button (click)="Idopontfoglalas()" 
                       class="px-6 md:px-8 py-3 md:py-4 
                       text-base md:text-lg 
                       font-medium rounded-lg 
                       border-2 border-white/80 
                       text-white hover:bg-white/10 
                       transition-all duration-300 
                      transform hover:scale-105 active:scale-95">
                Időpontot foglalok
              </button>
            </a>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
