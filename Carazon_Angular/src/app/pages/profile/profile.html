<div class="profile-container min-h-screen bg-gray-50 pt-20 pb-12">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
    
    <div class="bg-white rounded-2xl 
                  shadow-xl overflow-hidden mb-8">
      <div class="h-32 bg-amber-600">
      </div> 
      <div class="relative px-6 pb-6">
        <div class="relative -top-12 flex flex-col sm:flex-row 
                    items-end sm:items-center gap-4">
          <div class="h-32 w-32 rounded-full border-4 
                    border-white bg-gray-200 flex items-center 
                    justify-center overflow-hidden shadow-md">
            <span class="text-4xl font-bold text-amber-600">
              {{ user.name.charAt(0) }}
            </span>
          </div>
          
          <div class="flex-1 pb-2">
            <h2 class="text-3xl font-bold text-gray-900">
              {{ user.name }}
            </h2>
            <p class="text-gray-500">
              {{ user.email }}
            </p>
          </div>

          <button class="mb-2 px-4 py-2 bg-gray-100 hover:bg-gray-200 
                      text-gray-700 rounded-lg transition-colors font-medium">
            Profil szerkesztése
          </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-4">
          <div class="p-4 bg-amber-50 rounded-xl 
                      border border-amber-100 text-center">
            <p class="text-sm text-amber-600 font-semibold uppercase">
              Autóim
            </p>
            
            <p class="text-2xl font-bold text-gray-800">
              {{ user.carsCount }}
            </p>
          </div>

          <div class="p-4 bg-amber-50 rounded-xl border border-amber-100 text-center">
            <p class="text-sm text-amber-600 font-semibold uppercase">
              Befejezett szerviz
            </p>

            <p class="text-2xl font-bold text-gray-800">
              {{ user.completedServices }}
            </p>
          </div>

          <div class="p-4 bg-amber-50 rounded-xl border border-amber-100 text-center">
            <p class="text-sm text-amber-600 font-semibold uppercase">
              Tagság
            </p>

            <p class="text-2xl font-bold text-gray-800">
              Gold
            </p>
          </div>
        </div>
      </div>
    </div>

    <div class="bg-white rounded-2xl shadow-lg p-6">
      <h3 class="text-xl font-bold text-gray-900 mb-6 flex items-center">
        <span class="w-2 h-8 bg-amber-600 rounded-full mr-3">
        </span>
        Aktuális foglalásaim
      </h3>

      <div *ngIf="appointments.length > 0; else noAppointments" 
           class="space-y-4">

        <div *ngFor="let app of appointments" 
              class="flex flex-col md:flex-row justify-between 
                     items-start md:items-center p-5 border 
                     border-gray-100 rounded-xl 
                     hover:bg-gray-50 transition-colors">

          <div>
            <h4 class="font-bold text-lg text-gray-800">
              {{ app.carType }}
            </h4>
            <p class="text-sm text-gray-500">
              {{ app.serviceType }}
            </p>
          </div>

          <div class="mt-4 md:mt-0 flex items-center gap-6">
            <div class="text-right">
              <p class="font-medium text-gray-900">
                {{ app.date }}
              </p>

              <p class="text-xs text-amber-600 font-semibold">
                {{ app.status }}
              </p>
            </div>

            <button class="text-red-500 hover:text-red-700 font-medium text-sm">
              Lemondás
            </button>
          </div>
        </div>
      </div>

      <ng-template #noAppointments>
        <div class="text-center py-10">
          <p class="text-gray-400">
            Jelenleg nincs aktív foglalásod.
          </p>
          <button class="mt-4 text-amber-600 font-semibold hover:underline">
            Foglalj időpontot most!
          </button>
        </div>
      </ng-template>
    </div>
  </div>
</div>
