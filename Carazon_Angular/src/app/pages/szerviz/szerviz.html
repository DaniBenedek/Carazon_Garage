<section class="min-h-screen bg-zinc-950 py-20 
                px-4 flex items-center justify-center">

  <div class="w-full max-w-4xl bg-zinc-900/50 backdrop-blur-xl 
              border border-white/10 rounded-3xl overflow-hidden shadow-2xl">
    
    <div class="p-8 border-b border-white/5 flex justify-between items-center">
      <div>
        <h2 class="text-2xl font-bold text-white tracking-tight">
          Időpontfoglalás
        </h2>
        <p class="text-amber-500/80 text-sm italic">
          Carazon Garage Időpont foglalás
        </p>
      </div>
      
      <div class="flex gap-2">
        <div [class]="currentStep >= 1 ? 'w-8 h-1 bg-amber-600' : 'w-8 h-1 bg-zinc-700'" 
             class="rounded-full transition-all">
        </div>
        <div [class]="currentStep >= 2 ? 'w-8 h-1 bg-amber-600' : 'w-8 h-1 bg-zinc-700'" 
             class="rounded-full transition-all">
        </div>
        <div [class]="currentStep >= 3 ? 'w-8 h-1 bg-amber-600' : 'w-8 h-1 bg-zinc-700'" 
             class="rounded-full transition-all">
        </div>
      </div>
    </div>

    <div class="p-8">
      
      <div *ngIf="currentStep === 1" class="animate-fade-in space-y-8">
        <div class="grid md:grid-cols-2 gap-10">
          
          <div>
            <div class="flex items-center justify-between mb-4">
              <label class="block text-zinc-400 text-sm uppercase tracking-widest">
                Válasszon napot
              </label>
              <div class="flex items-center gap-2 text-white text-xs font-bold">
                <button (click)="changeMonth(-1)" class="hover:text-amber-500 transition px-1">&lt;</button>
                <span class="w-24 text-center uppercase">{{ currentMonth | date:'MMMM':'':'hu' }}</span>
                <button (click)="changeMonth(1)" class="hover:text-amber-500 transition px-1">&gt;</button>
              </div>
            </div>
            <div class="grid grid-cols-7 gap-2">
              <div *ngFor="let wd of weekDays" class="text-[10px] text-zinc-600 text-center font-bold mb-1 uppercase">
                {{wd}}
              </div>
              <ng-container *ngFor="let day of daysInMonth">
                <button *ngIf="day !== 0" 
                        (click)="selectDate(day)"
                        [disabled]="isDayClosed(day)"
                        [class]="selectedDate?.getDate() === day && selectedDate?.getMonth() === currentMonth.getMonth() ? 'bg-amber-600 text-white' : 
                                 isDayClosed(day) ? 'bg-red-900/30 text-red-500 cursor-not-allowed opacity-50' : 
                                 'bg-white/5 text-zinc-300 hover:bg-white/10'"
                        class="aspect-square rounded-xl transition-all flex 
                               items-center justify-center font-medium border border-white/5">
                  {{day}}
                </button>
                <div *ngIf="day === 0" class="aspect-square"></div>
              </ng-container>
            </div>
            <p class="text-xs text-zinc-500 mt-3">
              <span class="text-red-500">●</span> Zárva / Múlt
            </p>
          </div>

          <div>
            <label class="block text-zinc-400 text-sm mb-4 uppercase tracking-widest">
              Szabad időpontok
            </label>
            <div *ngIf="timeSlots.length > 0; else noSlots" class="grid grid-cols-3 gap-2 h-48 overflow-y-auto pr-2 custom-scrollbar">
              <button *ngFor="let slot of timeSlots" 
                      (click)="selectedSlot = slot"
                      [class]="selectedSlot === slot ? 'border-amber-500 
                               text-amber-500 bg-amber-500/10' : 'border-white/5 text-zinc-400 bg-white/5'"
                      class="py-2 border rounded-lg hover:border-amber-500/50 transition-all text-sm font-medium">
                {{slot}}
              </button>
            </div>
            <ng-template #noSlots>
              <div class="h-48 flex items-center justify-center border 
                          border-dashed border-white/10 rounded-lg text-zinc-600 
                          italic text-xs text-center">
                Válasszon szabad napot
              </div>
            </ng-template>
          </div>
        </div>
        
        <div class="flex justify-end pt-6">
          <button (click)="nextStep()" 
                  [disabled]="!selectedSlot || !selectedDate"
                  class="px-10 py-3 bg-amber-600 hover:bg-amber-700 disabled:opacity-30 
                          text-white rounded-full font-semibold transition-all transform hover:scale-105">
            Tovább az adatokhoz
          </button>
        </div>
      </div>
      
      <div *ngIf="currentStep === 2" class="animate-fade-in max-w-lg mx-auto">
        <form [formGroup]="bookingForm" class="space-y-6">
          <div class="space-y-4">
            <select formControlName="service"
                    class="w-full bg-white/5 border-b border-white/10 p-3 text-white 
                           focus:border-amber-600 outline-none transition-all">
              <option value="" disabled selected>Válasszon szolgáltatást</option>
              <option *ngFor="let s of services" [value]="s.id" class="text-black">
                {{s.name}} Ár ({{s.price}}) -tól
              </option>
            </select>

            <input formControlName="name" placeholder="Teljes név"
                   class="w-full bg-white/5 border-b border-white/10 p-3 text-white focus:border-amber-600 outline-none">

            <input formControlName="email" type="email" placeholder="Email cím" 
                   class="w-full bg-white/5 border-b border-white/10 p-3 text-white focus:border-amber-600 outline-none">

            <input formControlName="phone" placeholder="Telefonszám"
                   class="w-full bg-white/5 border-b border-white/10 p-3 text-white focus:border-amber-600 outline-none">
          </div>

          <div class="flex flex-col gap-3">
            <button (click)="confirmBooking()" 
                    [disabled]="bookingForm.invalid"
                    class="w-full py-4 bg-amber-600 hover:bg-amber-700 disabled:opacity-30 
                           text-white rounded-xl font-bold transition-all transform active:scale-95">
              Foglalás véglegesítése
            </button>
          
            <button (click)="currentStep = 1" type="button"
                    class="w-full py-2 text-zinc-500 hover:text-zinc-300 text-sm font-medium transition-colors">
              &larr; Vissza az időpont módosításához
            </button>
          </div>
        </form>
      </div>

      <div *ngIf="currentStep === 3" class="text-center py-10 animate-scale-up">
        <div class="w-20 h-20 bg-amber-600/20 text-amber-500 rounded-full 
                    flex items-center justify-center mx-auto mb-6">
          <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
          </svg>
        </div>
        <h2 class="text-3xl font-bold text-white mb-2">Sikeres foglalás!</h2>
        <p class="text-zinc-400 mb-8">A visszaigazolást elküldtük az email címére.</p>
        <button onclick="location.reload()" class="text-amber-500 hover:text-amber-400 font-medium">
          Vissza a főoldalra
        </button>
      </div>
      
    </div>
  </div>
</section>
