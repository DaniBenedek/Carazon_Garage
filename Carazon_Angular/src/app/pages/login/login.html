<section 
  class="min-h-screen bg-gray-50 
         dark:bg-gray-900">

  <div 
    class="flex flex-col items-center justify-center 
           px-6 py-8 mx-auto 
           min-h-screen lg:py-0">

    <a 
      href="#" 
      class="flex items-center mb-6 
             text-2xl font-semibold 
             text-gray-900 dark:text-white">
      Carazon    
    </a>

    <div 
      class="w-full bg-white rounded-lg shadow 
             dark:border md:mt-0 sm:max-w-md 
             xl:p-0 dark:bg-gray-800 
             dark:border-gray-700">

      <div 
        class="p-6 space-y-4 md:space-y-6 sm:p-8">

        <h1 
          class="text-xl font-bold 
                 leading-tight tracking-tight 
                 text-gray-900 md:text-2xl 
                 dark:text-white">
          Jelentkezz be a fiókodba
        </h1>

        <form 
          #loginForm="ngForm" 
          (ngSubmit)="login()" 
          class="space-y-4 md:space-y-6">
          
          <div>
            <label 
              for="email" 
              class="block mb-2 text-sm font-medium 
                    text-gray-900 dark:text-white">
              Email
            </label>
            <input 
              type="email" 
              maxlength="150"
              name="email"
              [(ngModel)]="email"
              id="email" 
              autocomplete="email"
              class="bg-gray-50 border border-gray-300 
                     text-gray-900 rounded-lg 
                     focus:ring-primary-600 focus:border-primary-600 
                     block w-full p-2.5 
                     dark:bg-gray-700 dark:border-gray-600 
                     dark:text-white
                     placeholder-gray-500" 
              placeholder="pelda@email.com" 
              required
              email>
          </div>

          <div>
            <label 
              for="password" 
              class="block mb-2 text-sm font-medium 
                    text-gray-900 dark:text-white">
              Jelszó
            </label>
            <input 
              [type]="isPasswordVisible ? 'text' : 'password'" 
              name="password"
              [(ngModel)]="password"
              maxlength="100"
              id="password" 
              autocomplete="current-password"
              class="bg-gray-50 border border-gray-300 
                     text-gray-900 rounded-lg 
                     focus:ring-primary-600 focus:border-primary-600 
                     block w-full p-2.5 
                     dark:bg-gray-700 dark:border-gray-600 
                     dark:text-white" 
              required>
          </div>

          <div 
            class="min-h-8 flex items-center justify-center">
            <p 
              *ngIf="error()" 
              class="text-red-600 text-sm font-bold text-center">
              {{ error() }}
            </p>
          </div>

          <div 
            class="flex items-center">
            <div 
              class="flex items-center h-5">
              <input 
                id="showpass" 
                (change)="togglePassword()" 
                type="checkbox" 
                class="w-4 h-4 border border-gray-300 
                       rounded bg-gray-50 
                       focus:ring-3 focus:ring-primary-300 
                       dark:bg-gray-700 dark:border-gray-600 
                       dark:focus:ring-primary-600">
            </div>
            <div 
              class="ml-3 text-sm">
              <label 
                for="showpass" 
                class="text-gray-500 dark:text-gray-300">
                Mutasd a jelszót!
              </label>
            </div>
          </div>


          <div 
            class="flex items-center justify-between">
            <div 
              class="flex items-start">
              <div 
                class="flex items-center h-5">
                <input 
                  id="remember" 
                  name="remember"
                  type="checkbox" 
                  class="w-4 h-4 border border-gray-300 
                         rounded bg-gray-50">
              </div>
              <div 
                class="ml-3 text-sm">
                <label 
                  for="remember" 
                  class="text-gray-500 dark:text-gray-300">
                  Emlékezz rám
                </label>
              </div>
            </div>
            <a 
              href="#" 
              class="text-sm font-medium text-primary-600 
                     hover:underline dark:text-amber-500">
              Elfelejtett jelszó?
            </a>
          </div>

          <button 
            type="submit"
            [disabled]="loginForm.invalid"
            [class.opacity-50]="loginForm.invalid"
            [class.cursor-not-allowed]="loginForm.invalid"
            class="w-full text-white bg-amber-600 
                   hover:bg-amber-700 
                   focus:ring-4 focus:outline-none 
                   focus:ring-amber-300 
                   font-medium rounded-lg text-sm 
                   px-5 py-2.5 text-center 
                   transition-all">
            Bejelentkezés
          </button>

          <p 
            class="text-sm font-light 
                   text-gray-500 dark:text-gray-400">
            Nincs még fiókod? 
            <a 
              href="/Register" 
              class="font-medium text-primary-600 
                     hover:underline dark:text-primary-500">
              Regisztráció
            </a>
          </p>
        </form>
      </div>
    </div>
  </div>
</section>
