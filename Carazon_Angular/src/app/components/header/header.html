<!-- MOBILE MENU -->
<div *ngIf="isMenuOpen"
     class="md:hidden fixed inset-0 z-40">

  <!-- háttér -->
  <div class="absolute inset-0 bg-black/40"
       (click)="closeMenu()"></div>

  <!-- menü -->
  <div class="absolute top-16 left-0 w-full
              bg-white dark:bg-gray-900
              shadow-xl">

    <nav class="px-6 py-6">
      <ul class="flex flex-col gap-4 text-base">

        <!-- NAV -->
        <li>
          <a href="/Szerviz"
             (click)="closeMenu()"
             class="block text-gray-700 dark:text-white">
            Szerviz
          </a>
        </li>

        <li>
          <a href="/Career"
             (click)="closeMenu()"
             class="block text-gray-700 dark:text-white">
            Careers
          </a>
        </li>

        <li>
          <a href="/History"
             (click)="closeMenu()"
             class="block text-gray-700 dark:text-white">
            History
          </a>
        </li>

        <li>
          <a href="/Projects"
             (click)="closeMenu()"
             class="block text-gray-700 dark:text-white">
            Projects
          </a>
        </li>

        <hr class="border-gray-200 dark:border-gray-700">

        <!-- AUTH -->
        <li *ngIf="!auth.isLoggedIn()">
          <a href="/Login"
             (click)="closeMenu()"
             class="block w-full rounded-md
                    bg-amber-600 px-4 py-2
                    text-center text-white">
            Login
          </a>
        </li>

        <li *ngIf="!auth.isLoggedIn()">
          <a href="/Register"
             (click)="closeMenu()"
             class="block w-full rounded-md
                    bg-gray-200 px-4 py-2
                    text-center
                    dark:bg-gray-800 dark:text-white">
            Register
          </a>
        </li>

        <li *ngIf="auth.isLoggedIn()">
          <button
            (click)="logout(); closeMenu()"
            class="w-full rounded-md
                   bg-red-500 px-4 py-2
                   text-white">
            Kilépés
          </button>
        </li>

      </ul>
    </nav>
  </div>
</div>
<header class="bg-white 
               dark:bg-gray-900 fixed 
               top-0 left-0 
               right-0 z-50">
  <div class="mx-auto max-w-8xl 
              px-4 sm:px-6 lg:px-8">
    <div class="flex h-16 
                items-center justify-between">
      <div class="flex-1 md:flex 
                  md:items-center md:gap-12">
        <a class="block 
                  text-teal-600 dark:text-teal-300" 
            href="/">
          <span class="sr-only">
            Home
          </span>
          <img [src]="'assets/pictures/carazonGaragelogo0.2.png'" 
               alt="Mukodik?" 
               class="h-20 w-20 mt-2">
        </a>
      </div>

      <div class="md:flex 
                  md:items-center 
                  md:gap-12">
        <nav aria-label="Global" 
             class="hidden md:block">
          <ul class="flex 
                     items-center 
                     gap-6 
                     text-sm">
            <li>
              <a class="text-gray-500 
                        transition 
                        hover:text-gray-500/75 
                        dark:text-white 
                        dark:hover:text-white/75" 
                  href="/Szerviz">
                Szerviz
              </a>
            </li>

            <li>
              <a class="text-gray-500 transition 
                        hover:text-gray-500/75 dark:text-white 
                        dark:hover:text-white/75" 
                  href="/Career">
                Careers
              </a>
            </li>

            <li>
              <a class="text-gray-500 transition 
                        hover:text-gray-500/75 
                        dark:text-white 
                        dark:hover:text-white/75" 
                 href="/History">
                History
              </a>
            </li>

            <li>
              <a class="text-gray-500 transition 
                        hover:text-gray-500/75 dark:text-white 
                        dark:hover:text-white/75" 
                 href="/Szerviz">
                Services
              </a>
            </li>

            <li>
              <a class="text-gray-500 transition 
                        hover:text-gray-500/75 
                        dark:text-white 
                        dark:hover:text-white/75" 
                 href="/Projects">
                Projects
              </a>
            </li>
          </ul>
        </nav>

        <div class="flex items-center gap-4">
          <div class="sm:flex sm:gap-4">
            <a class="rounded-md bg-amber-600 px-5 
                      py-2.5 text-sm font-medium 
                      text-white shadow-sm " 
               *ngIf="!auth.isLoggedIn()" 
               href="/Login">
              Login
            </a>

            <div *ngIf="auth.isLoggedIn()" 
                  class="flex items-center gap-4">
              <span class="text-white">{{ user?.name }}</span>
              <button (click)="logout()" 
                      class="bg-red-500 px-5 py-2.5 
                             rounded-md text-sm 
                             shadow-sm text-white">
                Kilépés
              </button>
            </div>

            <div class="hidden sm:flex">
              <a class="rounded-md bg-gray-100 px-5 
                        py-2.5 text-sm font-medium 
                        dark:bg-gray-800 
                        dark:text-white"
                  *ngIf="!auth.isLoggedIn()" 
                 href="/Register">
                Register
              </a>
            </div>
          </div>
          <div class="block md:hidden">
            <button
              (click)="toggleMenu()"
              class="rounded-md p-2
                     bg-gray-100 dark:bg-gray-800
                     text-gray-600 dark:text-white">
              <svg xmlns="http://www.w3.org/2000/svg"
                   class="h-6 w-6"
                   fill="none"
                   viewBox="0 0 24 24"
                   stroke="currentColor"
                   stroke-width="2">
                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M4 6h16M4 12h16M4 18h16"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
